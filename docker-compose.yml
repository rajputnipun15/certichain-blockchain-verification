version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/certichain?schema=public
      - JWT_SECRET=certichain_production_jwt_secret_key_2026
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: certichain_postgres
    environment:
      POSTGRES_DB: certichain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
